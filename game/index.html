<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Fortuna</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14100d; /* dark page under the letterbox bars */
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 1280x720 logical canvas, letterboxed by the renderer (which sets the CSS size), pixel-doubled
     by the browser at a whole size so the art stays crisp. */
  #game {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    background: #2b2420;
    image-rendering: auto;
    touch-action: none;
    outline: none;
  }
  /* Faults: hidden until something goes wrong, then readable text on a dark banner. */
  #errors {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 40vh;
    overflow: auto;
    margin: 0;
    padding: 10px 14px;
    background: rgba(60, 10, 12, 0.94);
    color: #ffd9d0;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Vice Fortuna: an open-world coast city. WASD to walk or drive, F to enter a car, 1 and 2 for weapons, E to talk."></canvas>
<div id="errors" role="alert" aria-live="assertive" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
